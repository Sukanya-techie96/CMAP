variables:
  SELENIUM_URL: http://selenium__standalone-chrome:4444/wd/hub
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: dev.cert.siemens.com:4567/forensic/cmap/cmap-fe
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HTTP_PROXY: "http://proxy-client.cert.siemens.com:8000"
  HTTPS_PROXY: "http://proxy-client.cert.siemens.com:8000"
  NO_PROXY: "localhost,127.0.0.1,.siemens.com"

default:
  interruptible: true
  tags:
    - docker-generic

stages:
  - test
  - build
  - deploy

test:
  image: node:24
  stage: test
  services:
    - selenium/standalone-chrome:138.0-20250707
  script:
    - https_proxy=$HTTP_PROXY no_proxy=$NO_PROXY npm install
    - npm run lint:format
    - npm run lint
    - npm run lint:sass
    - npm run test -- --progress=false --code-coverage
    - npm run build:prod -- --progress=false
  coverage: '/Statements\s*:\s*(\d+\.?\d+)\%/'
  allow_failure: true
  artifacts:
    expire_in: 3h
    paths:
      - dist/
    reports:
      junit: dist/reports/cmap-frontend/test-*.xml
      coverage_report:
        coverage_format: cobertura
        path: dist/coverage/cmap-frontend/cobertura-coverage.xml

e2e:
  stage: test
  image:
    name: mcr.microsoft.com/playwright:v1.54.1
    entrypoint: ['']
  variables:
    GIT_LFS_SKIP_SMUDGE: 0
  script:
    - https_proxy=$HTTP_PROXY no_proxy=$NO_PROXY npm install
    - npm run e2e
  needs: ['test']
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1d
    paths:
      - playwright/results/preview
      - playwright/results/tests
      - playwright/results/reports
    reports:
      junit: playwright/results/reports/report-*.xml

build:
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - |
      docker build -f docker/Dockerfile \
        --build-arg HTTP_PROXY=${HTTP_PROXY} \
        --build-arg HTTPS_PROXY=${HTTPS_PROXY} \
        --build-arg NO_PROXY=${NO_PROXY} \
        --build-arg NPM_TOKEN=${CI_JOB_TOKEN} \
        -t $IMAGE_NAME:$IMAGE_TAG \
        -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - master
  tags:
    - leda
